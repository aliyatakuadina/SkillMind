        # ===========================================================
        # SkillMind on itwin.kz.
        # Include from the server 443 block.
        # LiteLLM on 127.0.0.1:4000 must NOT be proxied here.
        # SPA: VITE_BASE=/skillmind/ pnpm build, then copy dist/ to /var/www/skillmind
        # ===========================================================
        location = /skillmind {
            return 301 $scheme://$host/skillmind/;
        }

        location /skillmind/ {
            root /var/www;
            index index.html;
            try_files $uri $uri/ /skillmind/index.html;
        }

        location = /skillmind-api {
            return 301 $scheme://$host/skillmind-api/;
        }

        location /skillmind-api/ {
            client_max_body_size 2048m;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:8015/;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Prefix /skillmind-api;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout 3600s;
            proxy_read_timeout 3600s;
        }

        # Course files are signed as https://itwin.kz/<bucket>/<object>
        location ^~ /course-assets/ {
            client_max_body_size 2048m;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /submission-files/ {
            client_max_body_size 2048m;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location ^~ /certificates/ {
            client_max_body_size 20m;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
        }

        # Path-style presigned uploads: https://itwin.kz/skillmind-media/<object>
        location ^~ /skillmind-media/ {
            client_max_body_size 0;
            proxy_request_buffering off;
            proxy_pass http://127.0.0.1:9000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
