[project]
name = "skillmind-server"
version = "0.1.0"
description = "SkillMind upload API and AI worker"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.35",
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.6",
  "psycopg2-binary>=2.9",
  "pyjwt[crypto]>=2.10",
  "pyyaml>=6.0",
  "supabase>=2.10",
  "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skillmind_server*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
